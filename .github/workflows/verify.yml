name: Verify public release
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows-acceptance:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 / Node 24
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 / Node 24
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 / Node 24
        with:
          node-version: '22'
      - name: Install locked dependencies
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/setup.ps1
      - name: Scan tracked public files
        run: .venv\Scripts\python.exe scripts/privacy_scan.py --out work/ci-privacy.json
      - name: Full isolated acceptance
        run: .venv\Scripts\python.exe scripts/evaluate.py --out work/ci-acceptance
